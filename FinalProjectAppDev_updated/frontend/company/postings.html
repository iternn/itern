<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postings · ITern for Companies</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<style>.content { max-width: 820px; }</style>
</head>
<body>
  <div class="app-shell">
    <div id="navMount"></div>
    <main class="main">
      <div class="content">
      <div class="page-head">
        <div><h1>Postings</h1><p>Manage your internship listings.</p></div>
        <button class="btn btn-primary" id="newBtn" type="button">+ New posting</button>
      </div>
      <div class="card" style="padding:6px 24px;"><div class="row-list" id="list"></div></div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="backdrop">
    <div class="modal">
      <h3 id="modalTitle">New posting</h3>
      <form id="postForm" style="margin-top:16px;">
        <input type="hidden" id="postId">
        <div class="field"><label>Title</label><input class="input" id="title" required></div>
        <div class="field"><label>Work mode</label>
          <select class="input" id="mode"><option>Remote</option><option>Hybrid</option><option>Onsite</option></select>
        </div>
        <div class="field"><label>Capacity (slots before waitlisting kicks in)</label><input class="input" id="capacity" type="number" min="1" value="1"></div>
        <div class="field"><label>Required skills (comma-separated)</label><input class="input" id="skills" placeholder="React, JavaScript, CSS"></div>
        <div class="field"><label>Status</label>
          <select class="input" id="status"><option>Draft</option><option>Active</option><option>Closed</option></select>
        </div>
        <div style="display:flex;gap:10px;margin-top:16px;">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary btn-block">Save posting</button>
        </div>
      </form>
    </div>
  </div>

<script type="module">
import { api, Session } from '../assets/js/api.js';
import { renderNav } from '../assets/js/nav.js';
renderNav('company', 'postings');

let editingId = null;

async function draw() {
  const postings = await api('/postings/mine', { token: Session.token() });
  list.innerHTML = postings.map(p => `
    <div class="row-item">
      <div class="row-avatar">${p.title.slice(0,2).toUpperCase()}</div>
      <div>
        <div class="row-title">${p.title}</div>
        <div class="row-sub">${p.work_mode} · capacity ${p.capacity} · ${p.applicant_count} applicants</div>
      </div>
      <div class="row-meta">
        <span class="badge ${p.status === 'Active' ? 'badge-strong' : 'badge-neutral'}">${p.status}</span>
        <button class="btn btn-ghost btn-sm" data-edit="${p.id}" type="button">Edit</button>
        <button class="btn btn-danger btn-sm" data-del="${p.id}" type="button">Delete</button>
      </div>
    </div>`).join('') || '<div class="empty-state">No postings yet — create your first one.</div>';

  list.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openModal(postings.find(p => p.id === b.dataset.edit))));
  list.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Delete this posting?')) return;
    await api(`/postings/${b.dataset.del}`, { method: 'DELETE', token: Session.token() });
    draw();
  }));
}

function openModal(p) {
  editingId = p ? p.id : null;
  modalTitle.textContent = p ? 'Edit posting' : 'New posting';
  document.getElementById('title').value = p?.title || '';
  document.getElementById('mode').value = p?.work_mode || 'Remote';
  document.getElementById('capacity').value = p?.capacity || 1;
  document.getElementById('skills').value = p?.skills || '';
  document.getElementById('status').value = p?.status || 'Draft';
  backdrop.classList.add('open');
}
newBtn.addEventListener('click', () => openModal(null));
cancelBtn.addEventListener('click', () => backdrop.classList.remove('open'));

postForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    title: document.getElementById('title').value,
    mode: document.getElementById('mode').value,
    capacity: Number(document.getElementById('capacity').value),
    status: document.getElementById('status').value,
    skills: document.getElementById('skills').value.split(',').map(s => s.trim()).filter(Boolean),
  };
  try {
    if (editingId) await api(`/postings/${editingId}`, { method: 'PATCH', token: Session.token(), body });
    else await api('/postings', { method: 'POST', token: Session.token(), body });
    backdrop.classList.remove('open');
    draw();
  } catch (err) {
    alert('Could not save posting: ' + err.message);
  }
});

draw();
</script>
</body>
</html>
