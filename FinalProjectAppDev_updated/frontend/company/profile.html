<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Profile · ITern</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<style>
  .avatar-editor { display:flex; align-items:center; gap:18px; margin-bottom:20px; }
  .avatar-editor .preview {
    width:88px; height:88px; border-radius:50%; object-fit:cover; background:var(--violet-100);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display);
    font-weight:800; font-size:26px; color:var(--violet-700); flex-shrink:0; border:1px solid var(--ink-100);
  }
</style>
</head>
<body>
  <div class="app-shell">
    <div id="navMount"></div>
    <div class="app-content">
    <div id="topbarMount"></div>
    <main class="main">
      <div class="content">
      <div class="page-banner"><div class="eyebrow"><span class="bar"></span>COMPANY PROFILE</div><h1>Tell interns who you are.</h1><p>A complete profile helps the right candidates find and trust you.</p></div>

      <div class="card" style="margin-bottom:20px;">
        <div class="card-head"><h3>Profile Completion</h3><b style="color:var(--violet-600);" id="completePct">0%</b></div>
        <div class="progress-bar" style="margin-bottom:12px;"><div class="fill" id="completeFill" style="width:0%"></div></div>
        <div id="checklist"></div>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <h3 style="margin-bottom:14px;">Profile picture</h3>
        <div class="avatar-editor">
          <img class="preview" id="photoPreview" style="display:none;">
          <div class="preview" id="photoFallback">?</div>
          <div>
            <input type="file" id="photoInput" accept="image/png,image/jpeg,image/webp">
            <div class="help-text">PNG, JPG, or WEBP — square images look best</div>
            <button class="btn btn-ghost btn-sm" id="removePhotoBtn" type="button" style="margin-top:8px;display:none;">Remove photo</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="field"><label>Industry</label><input class="input" id="industry"></div>
        <div class="field"><label>About</label><textarea class="input" id="about" rows="4"></textarea></div>
        <button class="btn btn-primary" id="saveBtn" type="button">Save changes</button>
      </div>
      </div>
    </main>
    </div>
  </div>

<script type="module">
import { api, Session, API_BASE, assetUrl } from '../assets/js/api.js';
import { renderNav, icon, toast } from '../assets/js/nav.js';
const nav = renderNav('company', 'profile');

async function load() {
  try {
    const me = await api('/companies/me', { token: Session.token() });
    industry.value = me.industry || '';
    about.value = me.about || '';
    renderPhoto(me);
    drawCompletion(me);
  } catch (err) {
    toast(`Couldn't load your profile: ${err.message}`);
  }
}

function drawCompletion(me) {
  const items = [
    ['Company name', !!me.name],
    ['Industry', !!(me.industry || '').trim()],
    ['About / description', !!(me.about || '').trim()],
    ['Logo or profile picture', !!me.profile_photo_path],
  ];
  const pct = Math.round(items.filter(i => i[1]).length / items.length * 100);
  completePct.textContent = pct + '%';
  completeFill.style.width = pct + '%';
  checklist.innerHTML = items.map(([label, ok]) =>
    `<div class="check-row ${ok ? 'ok' : 'todo'}">${icon(ok ? 'check' : 'alert', 15)}${label}</div>`).join('');
}

function renderPhoto(me) {
  if (me.profile_photo_path) {
    photoPreview.src = assetUrl(me.profile_photo_path);
    photoPreview.style.display = 'block';
    photoFallback.style.display = 'none';
    removePhotoBtn.style.display = 'inline-flex';
  } else {
    photoPreview.style.display = 'none';
    photoFallback.style.display = 'flex';
    photoFallback.textContent = (me.name || '?').slice(0, 2).toUpperCase();
    removePhotoBtn.style.display = 'none';
  }
}

saveBtn.addEventListener('click', async () => {
  try {
    await api('/companies/me', { method: 'PATCH', token: Session.token(), body: { industry: industry.value, about: about.value } });
    drawCompletion({ name: true, industry: industry.value, about: about.value, profile_photo_path: photoPreview.style.display === 'block' });
    saveBtn.textContent = 'Saved ✓';
    setTimeout(() => saveBtn.textContent = 'Save changes', 1500);
  } catch (err) {
    toast(`Couldn't save: ${err.message}`);
  }
});

photoInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('photo', file);
  try {
    const res = await fetch(API_BASE + '/companies/photo', {
      method: 'POST',
      headers: { Authorization: `Bearer ${Session.token()}` },
      body: form,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Upload failed (${res.status})`);
  } catch (err) {
    toast(`Couldn't upload photo: ${err.message}`);
  } finally {
    photoInput.value = '';
    await load();
    nav?.refreshAvatar();
  }
});

removePhotoBtn.addEventListener('click', async () => {
  try {
    await api('/companies/photo', { method: 'DELETE', token: Session.token() });
  } catch (err) {
    toast(`Couldn't remove photo: ${err.message}`);
  } finally {
    await load();
    nav?.refreshAvatar();
  }
});

load();
</script>
</body>
</html>
