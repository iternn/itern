<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matches · ITern</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
</head>
<body>
  <div class="app-shell">
    <div id="navMount"></div>
    <div class="app-content">
    <div id="topbarMount"></div>
    <main class="main">
      <div class="page-banner"><div class="eyebrow"><span class="bar"></span>YOUR MATCHES</div><h1>Internships that fit you.</h1><p>Ranked by how well your skills and goals line up with each posting.</p></div>
      <div class="stat-grid cols-3">
        <div class="stat-card"><div class="stat-icon tone-violet" data-icon="target"></div><div class="value" id="statBest">–</div><div class="label">Best match</div></div>
        <div class="stat-card"><div class="stat-icon tone-blue" data-icon="briefcase"></div><div class="value" id="statOpen">–</div><div class="label">Open postings</div></div>
        <div class="stat-card"><div class="stat-icon tone-green" data-icon="check"></div><div class="value" id="statApplied">–</div><div class="label">Applied so far</div></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Recommended for you</h3></div>
        <div class="filters">
          <input class="input grow" id="searchInput" placeholder="Search by title or company…">
          <select class="input" id="progFilter"><option value="">OJT &amp; Internship</option><option>OJT</option><option>Internship</option></select>
          <select class="input" id="payFilter"><option value="">Any pay</option><option value="Unpaid">Unpaid</option><option value="Allowance">With allowance</option><option value="Paid">Paid</option></select>
          <select class="input" id="modeFilter"><option value="">Any work mode</option><option>Remote</option><option>Hybrid</option><option>Onsite</option></select>
          <select class="input" id="locFilter"><option value="">Any location</option></select>
        </div>
        <div class="row-list" id="matchList"></div>
      </div>
    </main>
    </div>
  </div>

  <div class="modal-backdrop" id="detailBackdrop"><div class="modal wide" id="detailModal"></div></div>

<script type="module">
import { api, Session } from '../assets/js/api.js';
import { renderNav, onLive, matchRing, esc, toast } from '../assets/js/nav.js';
import { chipsHTML, factsHTML } from '../assets/js/posting.js';
import { rankPostings } from '../assets/js/match.js';
import { openApplyGate } from '../assets/js/requirements.js';
renderNav('student', 'matches');
onLive(() => load());

let scored = [];
let appliedIds = new Set();
searchInput.value = new URLSearchParams(location.search).get('q') || '';

async function load() {
  const me = await api('/interns/me', { token: Session.token() });
  let postings = [];
  try { postings = await api('/postings'); } catch {}
  let myApps = [];
  try { myApps = await api('/applications/mine', { token: Session.token() }); } catch {}
  appliedIds = new Set(myApps.map(a => a.posting_id));
  scored = rankPostings(me, postings);
  fillLocations();
  statBest.textContent = scored.length ? scored[0]._score + '%' : '—';
  statOpen.textContent = scored.length;
  statApplied.textContent = myApps.length;
  draw();
}

function visible() {
  const q = searchInput.value.trim().toLowerCase();
  return scored.filter(p =>
    (!q || p.title.toLowerCase().includes(q) || p.company_name.toLowerCase().includes(q)) &&
    (!progFilter.value || p.program_type === progFilter.value) &&
    (!payFilter.value || p.compensation_type === payFilter.value) &&
    (!modeFilter.value || p.work_mode === modeFilter.value) &&
    (!locFilter.value || p.location === locFilter.value));
}

function draw() {
  const rows = visible();
  matchList.innerHTML = rows.map(p => `
    <div class="row-item" style="align-items:flex-start;">
      ${matchRing(p._score, { size: 48 })}
      <div style="min-width:0;">
        <div class="row-title">${esc(p.title)}</div>
        <div class="row-sub"><a href="company-profile.html?id=${p.company_id}" style="color:var(--violet-600);text-decoration:none;">${esc(p.company_name)}</a> · ${esc(p.work_mode)}</div>
        ${chipsHTML(p)}
      </div>
      <div class="row-meta">
        <button class="btn btn-ghost btn-sm" data-details="${p.id}" type="button">Details</button>
        ${applyButton(p)}
      </div>
    </div>`).join('') || `<div class="empty-state">${scored.length ? 'No postings match your filters.' : 'No active postings yet — check back soon.'}</div>`;

  matchList.querySelectorAll('[data-details]').forEach(btn => btn.addEventListener('click', () => openDetails(scored.find(p => p.id === btn.dataset.details))));
  wireApply(matchList);
}

const applyButton = (p) => appliedIds.has(p.id)
  ? '<span class="badge badge-neutral">Applied</span>'
  : `<button class="btn btn-primary btn-sm" data-apply="${p.id}" type="button">Apply</button>`;

function wireApply(root) {
  // Apply never sends anything by itself: it opens the requirements checklist first.
  root.querySelectorAll('[data-apply]').forEach(btn => btn.addEventListener('click', () => {
    const posting = scored.find(p => p.id === btn.dataset.apply);
    openApplyGate({
      backdrop: detailBackdrop, modal: detailModal, posting,
      onSubmit: async () => {
        await api('/applications', { method: 'POST', token: Session.token(), body: { postingId: posting.id } });
        detailBackdrop.classList.remove('open');
        toast('Application sent! Track it under Applications.');
        load();
      },
    });
  }));
}

// Everything a student needs to compare internships before applying.
function openDetails(p) {
  detailModal.innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:6px;">
      ${matchRing(p._score, { size: 54 })}
      <div style="min-width:0;"><h3 style="font-size:18px;">${esc(p.title)}</h3>
        <div class="row-sub"><a href="company-profile.html?id=${p.company_id}" style="color:var(--violet-600);text-decoration:none;">${esc(p.company_name)}</a></div></div>
    </div>
    ${p.description ? `<p style="margin:14px 0;font-size:13.5px;line-height:1.55;white-space:pre-line;">${esc(p.description)}</p>` : '<div style="height:12px;"></div>'}
    ${factsHTML(p)}
    ${p.skills ? `<div style="margin-top:16px;"><div class="eyebrow-sm" style="margin-bottom:6px;">SKILLS WANTED</div>${p.skills.split(',').map(sk => `<span class="badge badge-neutral" style="margin:2px;">${esc(sk)}</span>`).join('')}</div>` : ''}
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn btn-ghost" id="detailClose" type="button">Close</button>
      <span style="flex:1;display:flex;">${appliedIds.has(p.id) ? '<button class="btn btn-ghost btn-block" disabled>Already applied</button>' : `<button class="btn btn-primary btn-block" data-apply="${p.id}" type="button">Apply to this ${esc(p.program_type || 'internship')}</button>`}</span>
    </div>`;
  detailClose.addEventListener('click', () => detailBackdrop.classList.remove('open'));
  wireApply(detailModal);
  detailBackdrop.classList.add('open');
  detailModal.scrollTop = 0;
}
detailBackdrop.addEventListener('click', (e) => { if (e.target === detailBackdrop) detailBackdrop.classList.remove('open'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') detailBackdrop.classList.remove('open'); });
// the location list is built from the postings that actually exist right now
function fillLocations() {
  const keep = locFilter.value;
  const places = [...new Set(scored.map(p => p.location).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  locFilter.innerHTML = '<option value="">Any location</option>' + places.map(l => `<option ${l === keep ? 'selected' : ''}>${esc(l)}</option>`).join('');
}
[progFilter, payFilter, modeFilter, locFilter].forEach(el => el.addEventListener('change', draw));
searchInput.addEventListener('input', draw);
load();
</script>
</body>
</html>
